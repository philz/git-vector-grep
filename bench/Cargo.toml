[package]
name = "vgg-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "corpus"
path = "src/bin/corpus.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# Heavy GPU backends are feature-gated so the core rig (ONNX CPU + CoreML)
# builds in seconds. `--features candle` pulls in candle + Metal.
[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]

[dependencies]
git-vector-grep = { path = ".." }
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
# Pin to the exact version fastembed uses so cargo unifies to one `ort`,
# and turn on the CoreML execution provider (ANE/GPU on Apple silicon).
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["coreml"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
# Used by the direct-ort (fixed-shape CoreML/ANE) backend and candle backend.
tokenizers = "0.20"
hf-hub = "0.5"
serde_json = "1"
# HTTP client for the afm (Apple NaturalLanguage) embeddings-server backend.
ureq = { version = "2", features = ["json"] }

# candle (Metal GPU) — optional
candle-core = { version = "0.8", optional = true, features = ["metal"] }
candle-nn = { version = "0.8", optional = true, features = ["metal"] }
candle-transformers = { version = "0.8", optional = true, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
