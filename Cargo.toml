[package]
name = "git-vector-grep"
version = "0.1.0"
edition = "2021"
description = "Fast CPU vector grep over a git repo, with git-blob-keyed embedding cache."
license = "MIT OR Apache-2.0"

[[bin]]
name = "git-vector-grep"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"

[dependencies]
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
sha1 = "0.10"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
bytemuck = { version = "1", features = ["derive"] }
memchr = "2"
