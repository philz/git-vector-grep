[package]
name = "git-vector-grep"
version = "0.1.0"
edition = "2021"
description = "Fast CPU vector grep over a git repo, with git-blob-keyed embedding cache."
license = "MIT OR Apache-2.0"

[lib]
name = "git_vector_grep"
path = "src/lib.rs"

[[bin]]
name = "git-vector-grep"
path = "src/main.rs"

[workspace]
members = ["bench"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"

[dependencies]
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
sha1 = "0.10"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
bytemuck = { version = "1", features = ["derive"] }
memchr = "2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

# --- Apple-GPU embedding backend (auto-enabled on Apple Silicon via build.rs
# `cfg(mlx)`). Requires the Metal Toolchain at build time. Absent on every other
# platform, so non-Apple-Silicon builds stay pure CPU/ONNX with no extra deps. ---
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { version = "0.25", features = ["metal"] }
mlx-sys = "0.2"
tokenizers = "0.20"
hf-hub = "0.5"
