name: Release

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  # Also build/release on explicit tags or manual dispatch.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    # Only auto-tag main after a green Test run. Manual dispatches and
    # direct tag pushes skip this and go straight to build.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: generate version tag
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          # Prefix the octal-encoded SHA with 9 so it sorts as a valid semver pre-release component.
          SHA_OCTAL=$(printf '%o' "0x${SHORT_SHA}")
          VERSION="0.${COUNT}.9${SHA_OCTAL}"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG} (${SHORT_SHA})"
          git push origin "${TAG}"

  build-linux:
    name: build linux-x86_64
    runs-on: ubuntu-latest
    # Run on tag pushes and manual dispatch directly. After auto-tag, the
    # newly-pushed tag fires a separate workflow run that picks this up.
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build (musl static)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl

      - name: package
        id: pkg
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/git-vector-grep
          test -x "$BIN"
          VERSION="${GITHUB_REF_NAME:-dev}"
          OUT="git-vector-grep-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p dist/$OUT
          cp "$BIN" dist/$OUT/git-vector-grep
          cp README.md LICENSE-MIT LICENSE-APACHE dist/$OUT/ 2>/dev/null || true
          tar -C dist -czf dist/$OUT.tar.gz $OUT
          (cd dist && sha256sum $OUT.tar.gz > $OUT.tar.gz.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

      - name: release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
